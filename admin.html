<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT SERVICE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    background: white;
    padding: 50px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
    max-width: 500px;
  }
  h1 { color: #2c3e50; margin-bottom: 30px; font-size: 36px; }
  .btn {
    display: inline-block;
    padding: 16px 40px;
    margin: 10px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    transition: all 0.3s;
    box-shadow: 0 6px 20px rgba(102,126,234,0.4);
  }
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(102,126,234,0.6);
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔧 IT SERVICE</h1>
  <p style="margin-bottom: 30px; font-size: 18px; color: #555;">Service Management System</p>
  <a href="admin.html" class="btn">👨‍💼 Admin Panel</a>
  <a href="engineer.html" class="btn">👷 Engineer Panel</a>
  <a href="customer.html" class="btn">👤 Customer Panel</a>
</div>
</body>
</html>
